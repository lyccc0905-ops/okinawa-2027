<title>沖繩 3/25–3/28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #faf8f2;
    --paper: #ffffff;
    --ink: #30434a;
    --ink-soft: #66777c;
    --line: #e5e2d8;
    --sea: #176b78;
    --sea-tint: #ddf1ee;
    --coral: #f4a58a;
    --coral-ink: #a9492a;
    --pending: #9aa6a8;
    --sand: #ecdfc6;
    --sand-deep: #cdb893;
    --shadow: 0 1px 2px rgba(23, 107, 120, .04), 0 10px 30px -16px rgba(23, 107, 120, .22);
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Heiti TC", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f1b1e;
      --paper: #172629;
      --ink: #e3eaea;
      --ink-soft: #9fb1b3;
      --line: #2a3b3e;
      --sea: #6cc3ce;
      --sea-tint: #1b3a3d;
      --coral: #f4a58a;
      --coral-ink: #f4a58a;
      --pending: #71858a;
      --sand: #5a4f3d;
      --sand-deep: #85745a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f1b1e;
    --paper: #172629;
    --ink: #e3eaea;
    --ink-soft: #9fb1b3;
    --line: #2a3b3e;
    --sea: #6cc3ce;
    --sea-tint: #1b3a3d;
    --coral: #f4a58a;
    --coral-ink: #f4a58a;
    --pending: #71858a;
    --sand: #5a4f3d;
    --sand-deep: #85745a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    padding-inline: 16px;
    padding-block: 0 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* ---------- header ---------- */
  header.hero { padding-block: 40px 20px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--sea);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(40px, 11vw, 64px);
    color: var(--sea);
    line-height: 1.05;
    margin: 6px 0 12px;
    text-wrap: balance;
  }
  h1 small {
    display: block;
    font-size: .38em;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 8px;
    font-family: var(--mono);
    letter-spacing: .02em;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .pill {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--sea-tint);
    color: var(--ink);
  }
  .pill b { font-family: var(--mono); font-weight: 600; color: var(--sea); }

  /* ---------- day nav ---------- */
  nav.days {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--ground);
    padding-block: 10px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    border-bottom: 1px solid var(--line);
  }
  nav.days a {
    text-decoration: none;
    color: var(--ink);
    text-align: center;
    padding: 6px 2px;
    border-radius: 10px;
    line-height: 1.25;
  }
  nav.days a:hover { background: var(--sea-tint); }
  nav.days a:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  nav.days a.on { background: var(--sea); color: var(--paper); }
  nav.days a.on .d { color: var(--sea-tint); }
  nav.days .d { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; }
  nav.days .n { font-family: var(--mono); font-weight: 600; font-size: 16px; }

  h2 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--sea);
    margin: 36px 0 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  h2 .sub { font-family: var(--sans); font-size: 13px; font-weight: 400; color: var(--ink-soft); }

  /* ---------- boarding passes ---------- */
  .passes { display: grid; gap: 14px; }
  .pass {
    background: var(--paper);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr auto;
    overflow: hidden;
  }
  .pass-main { padding: 16px 18px; min-width: 0; }
  .pass-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--ink-soft); gap: 8px; flex-wrap: wrap;
  }
  .pass-top .dir { background: var(--coral); color: #3a1d12; font-weight: 700; letter-spacing: .08em; padding: 1px 10px; border-radius: 999px; }
  .route {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    margin: 10px 0 6px;
  }
  .route .code { font-family: var(--mono); font-weight: 600; font-size: 34px; line-height: 1; }
  .route .time { font-family: var(--mono); font-size: 15px; margin-top: 4px; }
  .route .place { font-size: 12px; color: var(--ink-soft); }
  .route .arr { text-align: right; }
  .route .mid { text-align: center; font-size: 11px; color: var(--ink-soft); font-family: var(--mono); }
  .route .mid::before {
    content: ""; display: block; height: 1px; margin-bottom: 4px;
    background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px);
  }
  .pass-foot {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    font-size: 12px; color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 10px; margin-top: 10px;
  }
  .pass-foot b { color: var(--ink); font-weight: 500; }
  .stub {
    border-left: 2px dashed var(--line);
    padding: 16px 16px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    background: var(--sea-tint);
    min-width: 88px;
  }
  .stub .fn { font-family: var(--mono); font-weight: 600; font-size: 20px; color: var(--sea); }
  .stub .dt { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }

  /* ---------- baggage ---------- */
  .bags {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-top: 14px;
  }
  .bag {
    background: var(--paper); border-radius: 18px; box-shadow: var(--shadow);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .bag svg { width: 28px; height: 28px; color: var(--sea); margin-bottom: 4px; }
  .bag .name { font-weight: 700; }
  .bag .kg { font-family: var(--mono); font-size: 22px; font-weight: 600; line-height: 1.2; }
  .bag .kg small { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .bag .dim { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .bag .rule { font-size: 12px; color: var(--ink-soft); }
  @media (max-width: 560px) {
    .bags { grid-template-columns: 1fr; }
    .bag { display: grid; grid-template-columns: 32px 1fr auto; column-gap: 12px; align-items: center; }
    .bag svg { grid-row: span 3; margin: 0; }
    .bag .kg { grid-column: 3; grid-row: 1 / span 3; text-align: right; }
    .bag .name, .bag .dim, .bag .rule { grid-column: 2; }
  }

  .infos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .info {
    background: var(--paper); border-radius: 18px; box-shadow: var(--shadow);
    padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
    text-decoration: none; color: var(--ink);
  }
  a.info:hover { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--sea-tint); }
  .info:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .info .k { font-size: 12px; color: var(--ink-soft); }
  .info b { color: var(--sea); font-weight: 700; font-variant-numeric: tabular-nums; }
  .info small { font-size: 12px; color: var(--ink-soft); }
  @media (max-width: 400px) { .infos { grid-template-columns: 1fr; } }

  /* ---------- day timeline ---------- */
  .day { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 80px); }
  .day-head { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 12px; flex-wrap: wrap; }
  .day-head .num {
    font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
    color: var(--sea); background: var(--sea-tint); font-weight: 600;
    padding: 2px 8px; border-radius: 6px;
  }
  .day-head h3 { font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 0; color: var(--sea); }
  .day-head .date { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }

  ol.tl { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.tl::before {
    content: ""; position: absolute; left: 62px; top: 8px; bottom: 8px;
    width: 2px; background: var(--line);
  }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 0 22px; padding-block: 8px; position: relative; }
  .ev .t {
    font-family: var(--mono); font-size: 13px; text-align: right; padding-top: 1px;
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  .ev::after {
    content: ""; position: absolute; left: 57px; top: 14px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ground); border: 2px solid var(--sea);
  }
  .ev.flight::after { background: var(--sea); }
  .ev.alert::after { background: var(--coral); border-color: var(--coral); }
  .ev.alert .title { color: var(--coral-ink); }
  .ev.food::after { background: var(--coral); border-color: var(--coral); }
  .ev.food .title::before { content: "美食"; font-size: 11px; font-weight: 500; background: var(--coral); color: #3a1d12; padding: 0 6px; border-radius: 4px; margin-right: 6px; vertical-align: 2px; }
  .ev.food.pending::after { background: var(--ground); border: 2px dashed var(--coral); }
  .ev.food.pending .title { color: var(--ink-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-soft); margin-top: -6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid var(--sea); }
  .legend .f { background: var(--sea); }
  .legend .c { background: var(--coral); border-color: var(--coral); }
  .legend .p { border-color: var(--pending); border-style: dashed; }
  .shore { display: block; width: 100%; height: auto; margin-top: 24px; overflow: visible; }
  .shore .w1, .shore .w2 { fill: none; stroke: var(--sea); stroke-linecap: round; }
  .shore .w1 { stroke-width: 2.5; opacity: .28; }
  .shore .w2 { stroke-width: 2; opacity: .16; }
  .shore .sand circle { fill: var(--sand); }
  .shore .star { fill: var(--coral); stroke: var(--coral); stroke-width: 5; stroke-linejoin: round; }
  .shore .star-dots circle { fill: var(--paper); opacity: .75; }
  .shore .star2 { fill: var(--sea-tint); stroke: var(--sea-tint); stroke-width: 4; stroke-linejoin: round; }
  .shore .shell path, .shore .shell rect { fill: var(--sand); stroke: var(--sand-deep); stroke-width: 1.2; stroke-linejoin: round; }
  .shore .shell .ridge { fill: none; }
  .ev.pending::after { border-color: var(--pending); border-style: dashed; }
  .ev .body { min-width: 0; }
  .ev .title { font-weight: 700; }
  .ev .note { font-size: 13px; color: var(--ink-soft); }
  .ev.pending .title { color: var(--pending); font-weight: 500; }
  .ev .hours { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .ev .map { font-size: 12px; color: var(--sea); text-decoration: none; }
  .ev .map:hover { text-decoration: underline; }
  .shops { margin-top: 6px; }
  .shops summary {
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--sea); font-weight: 500;
    padding: 2px 10px; border-radius: 999px; background: var(--sea-tint);
    list-style: none;
  }
  .shops summary::-webkit-details-marker { display: none; }
  .shops summary::after { content: "▾"; font-size: 10px; transition: transform .15s; }
  .shops[open] summary::after { transform: rotate(180deg); }
  .shops summary:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .shops ul {
    list-style: none; margin: 8px 0 4px; padding: 4px 12px;
    background: var(--paper); border-radius: 14px; box-shadow: var(--shadow);
  }
  .shops li { padding-block: 8px; }
  .shops li + li { border-top: 1px solid var(--line); }
  .shops + .shops { margin-top: 4px; }
  .shops.cafes summary { background: var(--coral); color: #3a1d12; }
  .shops.cafes .kind { background: var(--coral); color: #3a1d12; }
  .shop-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
  .shop-top b { font-weight: 700; font-size: 14px; }
  .shop-top .kind { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--sea-tint); color: var(--sea); }
  .shop-note { font-size: 13px; color: var(--ink); }
  .shop-meta { font-size: 12px; color: var(--ink-soft); }
  .shop-meta a { color: var(--sea); text-decoration: none; }
  .shop-meta a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .shops summary::after { transition: none; } }
  .ev .tag {
    display: inline-block; font-size: 11px; font-family: var(--mono);
    padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px;
    background: var(--coral); color: #3a1d12;
  }

  /* ---------- checklist ---------- */
  .todo { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 6px 4px; }
  .todo label {
    display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start;
    padding: 10px 14px; cursor: pointer; border-radius: 10px;
  }
  .todo label + label { border-top: 1px solid var(--line); border-radius: 0; }
  .todo input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--sea); }
  .todo a.ext { color: var(--sea); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--sea-tint); }
  .todo a.ext:hover { text-decoration-color: var(--sea); }
  .todo .why { display: block; font-size: 12px; color: var(--ink-soft); }
  .todo input:checked + span { color: var(--ink-soft); text-decoration: line-through; }
  .todo input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

  footer { margin-top: 48px; font-size: 12px; color: var(--ink-soft); text-align: center; }

  @media (max-width: 480px) {
    .pass { grid-template-columns: 1fr; }
    .stub {
      border-left: 0; border-top: 2px dashed var(--line);
      flex-direction: row; justify-content: space-between; padding: 10px 18px;
    }
    .route .code { font-size: 28px; }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

  <h2>每日行程</h2>
  <div class="legend"><span><i class="f"></i>航班</span><span><i class="c"></i>美食・重點</span><span><i></i>行程</span><span><i class="p"></i>待安排</span></div>

      duration: "1h 40m", cabin: "經濟艙", aircraft: "A321neo", meal: "含餐點"
    },
    {
      dir: "回程", date: "2027-03-28", fn: "CI123",
      from: { code: "OKA", place: "那霸機場 國際線", time: "20:55" },
      to:   { code: "TPE", place: "桃園機場 第二航廈", time: "21:30" },
      duration: "1h 35m", cabin: "經濟艙", aircraft: "A321neo", meal: "含餐點"
    }
  ];

        { t: "08:00", title: "從那霸出發", note: "走沖繩自動車道到許田 IC，全程約 2 小時；早餐可以先買麵包帶上車，或在便利商店解決", type: "alert", cafes: CAFES.earlyBread },
        { t: "10:00", title: "沖繩美麗海水族館", note: "黑潮之海的鯨鯊必看；海洋博公園的海豚表演免費，約 10:30、11:30、13:00、15:00 各一場", hours: "8:30–18:30・17:30 最後入館・無公休", map: "沖縄美ら海水族館", shops: SHOPS.motobu, cafes: CAFES.aquarium },
        { t: "12:30", title: "午餐：岸本食堂", note: "創業百年的沖繩麵老店，柴火湯頭＋手打麵，搭配炊飯；中午常排隊（車程約 15 分）", hours: "11:00–17:00（賣完提早收）・週三公休", type: "food", map: "きしもと食堂 本部町", cafes: CAFES.kishimoto },
        { t: "13:45", title: "備瀨福木林道", note: "水族館旁的老聚落，福木樹隧道通到海邊，平路好走", hours: "戶外聚落", map: "備瀬のフクギ並木", cafes: CAFES.bise },
        { t: "15:00", title: "古宇利大橋・古宇利島", note: "開上跨海大橋，心形岩（Tinu 海灘）拍照（車程約 30 分）", hours: "戶外", map: "古宇利大橋", shops: SHOPS.kouri, cafes: CAFES.kouri },
        { t: "17:15", title: "晚餐：Seaside Drive-in", note: "恩納村 1967 年開業的美式餐廳，招牌濃湯與塔可飯；6 人先打 098-964-2272 問訂位（車程約 50 分）", hours: "9:00–21:00・週三公休", type: "food", map: "シーサイドドライブイン 恩納村" },
        { t: "18:30", title: "萬座毛看夕陽", note: "象鼻岩海崖，車程約 10 分；日落約 18:45，步道平緩，門票 ¥100", hours: "8:00–20:00・無公休", map: "万座毛" },
        { t: "19:10", title: "回那霸", note: "走高速約 1 小時" }
      ]
    },
    {
      date: "2027-03-27", title: "中部・海中道路・美國村",
      events: [
        { t: "09:00", title: "首里城公園", note: "正殿 2026/11/23 重新開放；進正殿要先上網預約 30 分鐘時段（一個月前開放），其他區域不用預約", hours: "付費區 8:30–18:00・17:30 最後入場", map: "首里城公園", shops: SHOPS.shuri, cafes: CAFES.shuri },
        { t: "11:00", title: "午餐：King Tacos 金武本店", note: "塔可飯的發源地，分量很大，可以兩人分一份（車程約 50 分）", hours: "10:30–21:00・無公休", type: "food", map: "キングタコス 金武本店" },
        { t: "12:45", title: "海中道路", note: "跨海的長直路，中途「海之驛 Ayahashi 館」可以停車看海（車程約 30 分）", hours: "Ayahashi 館 9:00–17:30", map: "海中道路", cafes: CAFES.kaichu },
        { t: "13:30", title: "宮城島 Nuchi Masu 製鹽所", note: "每整點與半點有免費導覽，後方「果報崖」是絕景海崖", hours: "9:00–17:30・無公休", map: "ぬちうなー", cafes: CAFES.miyagi },
        { t: "15:00", title: "勝連城跡", note: "世界遺產，城牆上可以看整片中城灣；上坡路段可視體力走一半（車程約 30 分）", hours: "9:00–18:00・17:30 停止售票・無公休", map: "勝連城跡" },
        { t: "16:30", title: "北谷美國村", note: "摩天輪、美式街區，Blue Seal 冰淇淋北谷店在這裡（車程約 40 分）", hours: "Blue Seal 11:00–22:00", map: "美浜アメリカンビレッジ", shops: SHOPS.chatan, cafes: CAFES.chatan },
        { t: "17:30", title: "晚餐：美國村海景餐廳", note: "牛排、漢堡、海鮮都有，可以現場挑", type: "food", map: "美浜アメリカンビレッジ" },
        { t: "18:30", title: "日落海灘看夕陽", note: "吃完走過去就到，日落約 18:45", map: "サンセットビーチ 北谷" },
        { t: "19:15", title: "回那霸", note: "車程約 40 分" }
      ]
    },
    {
      date: "2027-03-28", title: "那霸市區・返台",
      events: [
        { t: "08:30", title: "早餐：豬肉蛋飯糰本店", note: "Pork Tamago Onigiri 牧志市場店，在市場建築外，週日照常營業", hours: "7:00–20:00・無公休", type: "food", map: "ポークたまごおにぎり本店" },
        { t: "09:15", title: "國際通散步", note: "早上人少，慢慢逛到壺屋", shops: SHOPS.kokusaiMorning, cafes: CAFES.kokusaiMorning },
        { t: "10:00", title: "壺屋陶器街", note: "沖繩燒陶器小店，挑碗盤、風獅爺；各店公休日不同", hours: "多數店家約 10:00–18:00", map: "壺屋やちむん通り", shops: SHOPS.tsuboya },
        { t: "11:00", title: "退房、行李放車上", type: "alert" },
        { t: "11:30", title: "午餐：Jack's Steak House", note: "1953 年開業的老牛排館，不能訂位，中午開門就去比晚上好排", hours: "11:00–22:30・週三公休", type: "food", map: "ジャッキーステーキハウス" },
        { t: "13:00", title: "波上宮", note: "蓋在海崖上的神社，離 Jack's 車程約 5 分，旁邊就是波之上海灘", hours: "境內全天・授與所 9:00–16:45", map: "波上宮", cafes: CAFES.naminoue },
        { t: "14:30", title: "iias 沖繩豐崎", note: "離機場約 15 分的大型購物中心，最後採買伴手禮（車程約 20 分）", hours: "商店 10:00–21:00・餐廳 11:00–23:00", map: "iias沖縄豊崎", shops: SHOPS.iias, cafes: CAFES.iias },
        { t: "17:00", title: "晚餐：iias 沖繩豐崎", note: "在商場內吃完就近還車，不用再趕路", type: "food", map: "iias沖縄豊崎" },
        { t: "18:00", title: "加滿油、還車", note: "租車公司會檢查油量，再搭接駁車到機場", type: "alert" },
        { t: "18:55", title: "抵達那霸機場 國際線", note: "建議起飛前 2 小時到", type: "alert" },
        { t: "20:55", title: "CI123 起飛 → 桃園", note: "經濟艙 · A321neo · 含餐點", type: "flight" },
        { t: "21:30", title: "抵達桃園機場 T2", type: "flight", tag: "台灣時間" }
      ]
    }
  ];

  const todos = [
    { id: "hotel", text: "訂住宿：那霸市區 3 晚、6 人", why: "三間雙人房或一間公寓式整層；確認有停車場，以及停車費" },
    { id: "booking", text: "餐廳訂位：ゆうなんぎい 3/25 17:00（098-867-3765）、Seaside Drive-in 3/26 17:15（098-964-2272）", why: "6 人一桌很難現場排，能訂位的先訂" },
    { id: "shuri", text: "2 月底預約首里城正殿：3/27 09:00 時段、6 人", why: "官網線上預約，一個月前開放" },
    { id: "car", text: "預約租車：6 人＋行李要 8 人座以上大車，或租兩台", why: "3/25 機場取車、3/28 機場還車；每位駕駛都要帶台灣駕照正本＋日文譯本（監理站可辦）" },
    { id: "tickets", text: "預買美麗海水族館門票", why: "網路或便利商店買，現場少排一次隊" },
    { id: "esim", text: "網路：eSIM / 網卡" },
    { id: "jpy", text: "換日幣" },
    { id: "insurance", text: "旅平險" }
  ];

  // ===== render =====
  const WD = ["日", "一", "二", "三", "四", "五", "六"];
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const wd = s => WD[parse(s).getDay()];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // countdown
  const diff = Math.ceil((parse(days[0].date) - new Date(new Date().toDateString())) / 864e5);
  document.getElementById("countdown").innerHTML =
    diff > 0 ? `出發倒數 <b>${diff}</b> 天` : diff === 0 ? `<b>今天出發！</b>` : `旅程 <b>已出發</b>`;

  document.getElementById("dayNav").innerHTML = days.map((d, i) =>
    `<a href="#day${i + 1}"><span class="d">DAY ${i + 1} · ${wd(d.date)}</span><span class="n">${md(d.date)}</span></a>`
  ).join("");

  document.getElementById("passes").innerHTML = flights.map(f => `
    <article class="pass">
      <div class="pass-main">
        <div class="pass-top"><span class="dir">${f.dir}</span><span>中華航空</span></div>
        <div class="route">
          <div><div class="code">${f.from.code}</div><div class="time">${f.from.time}</div><div class="place">${f.from.place}</div></div>
          <div class="mid">${f.duration}</div>
          <div class="arr"><div class="code">${f.to.code}</div><div class="time">${f.to.time}</div><div class="place">${f.to.place}</div></div>
        </div>
        <div class="pass-foot"><span>艙等 <b>${f.cabin}</b></span><span>機型 <b>${f.aircraft}</b></span><span><b>${f.meal}</b></span></div>
      </div>
      <div class="stub"><div class="fn">${f.fn}</div><div class="dt">${md(f.date)} (${wd(f.date)})</div></div>
    </article>`).join("");

  const ICONS = {
    backpack: '<path d="M8 7V5a4 4 0 0 1 8 0v2"/><rect x="5" y="7" width="14" height="14" rx="4"/><path d="M9 14h6v4H9z"/>',
    carry: '<path d="M9 6V3h6v3"/><rect x="6" y="6" width="12" height="13" rx="2"/><path d="M9 21h.01M15 21h.01M9 11h6"/>',
    checked: '<path d="M9 5V2h6v3"/><rect x="5" y="5" width="14" height="15" rx="2"/><path d="M9 8v9M12 8v9M15 8v9M8 22h.01M16 22h.01"/>'
  };
  document.getElementById("bags").innerHTML = baggage.map(b => `
    <div class="bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[b.icon]}</svg>
      <div class="name">${b.name} × ${b.count}</div>
      <div class="kg">${b.kg ? `${b.kg}<small> kg</small>` : `<small>未註明重量</small>`}</div>
      <div class="dim">${b.dim}</div>
      <div class="rule">${b.rule}</div>
    </div>`).join("");

  // 附近可逛：景點旁的小店，收合在景點下面
  const mapUrl = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  const shopsHtml = (list, label = "附近可逛", cls = "") => `
    <details class="shops ${cls}">
      <summary>${label} · ${list.length} 間</summary>
      <ul>${list.map(x => `
        <li>
          <div class="shop-top"><b>${esc(x.name)}</b>${x.kind.map(k => `<span class="kind">${esc(k)}</span>`).join("")}</div>
          ${x.note ? `<div class="shop-note">${esc(x.note)}</div>` : ""}
          <div class="shop-meta">${x.hours ? `營業 ${esc(x.hours)}` : ""}${x.map ? ` <a href="${mapUrl(x.map)}" target="_blank" rel="noopener">地圖 ↗</a>` : ""}</div>
        </li>`).join("")}
      </ul>
    </details>`;

  document.getElementById("days").innerHTML = days.map((d, i) => `
    <section class="day" id="day${i + 1}">
      <div class="day-head"><span class="num">DAY ${i + 1}</span><h3>${esc(d.title)}</h3><span class="date">${md(d.date)} (${wd(d.date)})</span></div>
      <ol class="tl">${d.events.map(e => `
        <li class="ev ${e.type || ""}">
          <div class="t">${esc(e.t)}</div>
          <div class="body"><div class="title">${esc(e.title)}${e.tag ? `<span class="tag">${esc(e.tag)}</span>` : ""}</div>${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}${e.hours ? `<div class="hours">營業 ${esc(e.hours)}</div>` : ""}${e.shops ? shopsHtml(e.shops) : ""}${e.cafes ? shopsHtml(e.cafes, "甜點・咖啡", "cafes") : ""}${e.map ? `<a class="map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.map)}" target="_blank" rel="noopener">地圖 ↗</a>` : ""}</div>
        </li>`).join("")}
      </ol>
    </section>`).join("");

  // 高亮目前看到的那一天
  // 點日期時直接鎖定那一天，等捲動停下才恢復跟著捲動更新，避免滑過中間幾天時亂跳
  const navLinks = [...document.querySelectorAll("#dayNav a")];
  const daySecs = [...document.querySelectorAll(".day")];
  const nav = document.getElementById("dayNav");
  const setOn = id => navLinks.forEach(a => a.classList.toggle("on", a.hash === "#" + id));
  let lockUntilIdle = false, idleTimer = 0, ticking = false;

  function syncFromScroll() {
    ticking = false;
    if (lockUntilIdle) return;
    const line = nav.getBoundingClientRect().bottom + 24;
    const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
    let current = null;
    if (atBottom) current = daySecs[daySecs.length - 1];
    else daySecs.forEach(d => { if (d.getBoundingClientRect().top <= line) current = d; });
    if (current && current.getBoundingClientRect().bottom < line - 200) current = null; // 已經捲到每日行程下面
    navLinks.forEach(a => a.classList.toggle("on", !!current && a.hash === "#" + current.id));
  }

  addEventListener("scroll", () => {
    if (lockUntilIdle) {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { lockUntilIdle = false; }, 150);
      return;
    }
    if (!ticking) { ticking = true; requestAnimationFrame(syncFromScroll); }
  }, { passive: true });

  nav.addEventListener("click", e => {
    const a = e.target.closest("a"); if (!a) return;
    setOn(a.hash.slice(1));
    lockUntilIdle = true;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { lockUntilIdle = false; }, 800); // 萬一沒有捲動（已在原位）
  });
  syncFromScroll();

  // checklist (per-device)
  const KEY = "okinawa-2027-todo";
  let done = {};
  try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const todoEl = document.getElementById("todo");
  const todoHtml = t => `
    <label for="todo-${t.id}">
      <input type="checkbox" id="todo-${t.id}" data-id="${t.id}" ${done[t.id] ? "checked" : ""}>
      <span>${t.url ? `<a class="ext" href="${t.url}" target="_blank" rel="noopener">${esc(t.text)} ↗</a>` : esc(t.text)}${t.why ? `<span class="why">${esc(t.why)}</span>` : ""}</span>
    </label>`;
  todoEl.innerHTML = todos.map(todoHtml).join("");
  // 日幣匯率：每天早上 8 點由排程更新到這個頁面的資料庫（rates/jpy）
  (async () => {
    const el = document.getElementById("jpyRate");
    const meta = document.getElementById("jpyMeta");
    const fail = () => { el.textContent = "暫時無法取得"; };
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) return fail();
    db.doc("rates/jpy").onSnapshot(snap => {
      const r = snap.exists ? snap.data() : null;
      if (!r || typeof r.twdPerJpy !== "number") return fail();
      const d = new Date(r.fetchedAt);
      const when = isNaN(d) ? "" : ` · ${d.getMonth() + 1}/${d.getDate()} 更新`;
      const per10k = Math.round(r.twdPerJpy * 10000).toLocaleString("zh-TW");
      el.textContent = `1 円 ≈ NT$${r.twdPerJpy.toFixed(4)}`;
      meta.textContent = `1 萬円 ≈ NT$${per10k}${when}`;
    }, fail);
  })();

  const onTodo = e => {
    const id = e.target.dataset.id; if (!id) return;
    done[id] = e.target.checked;
    try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
  };
  todoEl.addEventListener("change", onTodo);
</script>
